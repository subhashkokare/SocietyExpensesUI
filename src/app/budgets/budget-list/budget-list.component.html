<div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Budgets</h4>
      <div>
        <input class="form-control form-control-sm d-inline-block me-2" style="width:220px"
               placeholder="Filter by category/year" [(ngModel)]="q" (input)="applyFilter()" />
        <button class="btn btn-primary btn-sm" (click)="create()">Create</button>
      </div>
    </div>

    <table class="table table-sm table-hover">
      <thead class="table-light">
        <tr>
          <th>Year</th>
          <th>Category</th>
          <th class="text-end">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of filtered">
          <td>{{ b.year }}</td>
          <td>{{ b.category }}</td>
          <td class="text-end">₹{{ b.amount | number:'1.2-2' }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="edit(b.budgetId)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="remove(b.budgetId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!filtered.length" class="text-muted">No budgets found.</div>
